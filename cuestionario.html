<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información Básica | Galaxias Fósiles</title>
    <link rel="stylesheet" href="diseño.css">
</head>
<body>

    <main class="contenedor">
          <section class="content-section">
            <h2>¿Algun poblema?</h2>
    <div class="marquesina-fondo">
        <marquee scrollamount="5">Ayudanos a saber tu opinion🪄 </marquee>
    </div>
            <p>Haz notado algo raro en nuestra pagina?</p>  
              <p>Crees que podemos mejorar en algo?</p>
              <p>Algun dato es incorrecto?</p>
          </section>

        <section class="response-section">
            <h2>Déjanos tu respuesta</h2>
            <form id="formRespuesta">
                <div class="form-group">
                    <label for="nombre">Tu Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana Pérez" required>
                </div>

                <div class="form-group">
                    <label for="respuesta">Tu opinión o comentario:</label>
                    <textarea id="respuesta" name="respuesta" placeholder="Escribe aquí tu respuesta..." required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Respuesta</button>
            </form>
            
            <div id="mensaje-exito"></div>
        </section>

        <a href="indice.html" class="btn-regresar">← Volver al Menú Principal</a>
    </main>

    <div id="estrella">🌟</div>

    <footer>
        <p>✨ Galaxias Fósiles 2026 🌌</p>
    </footer>

    <script>
        const form = document.getElementById('formRespuesta');
        const mensajeExito = document.getElementById('mensaje-exito');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); 
            const nombre = document.getElementById('nombre').value;
            mensajeExito.textContent = `¡Gracias por tu respuesta, ${nombre}! Ha sido registrada con éxito.`;
            form.reset();
        });

        const estrella = document.getElementById('estrella');
        let posX = window.innerWidth / 2 - 30;
        let posY = 150;
        estrella.style.left = posX + 'px';
        estrella.style.top = posY + 'px';

        window.addEventListener('pointerdown', (e) => {
            const x = e.clientX - 30;
            const y = e.clientY - 30;
            estrella.style.transition = 'left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            estrella.style.left = x + 'px';
            estrella.style.top = y + 'px';
        });
    </script>

</body>
</html>
